  /v3/categories/{alias}:
    get:
      tags:
        - Categories
      summary: Category Details
      description: >
        Returns detailed information about the Yelp category specified by its alias. Category aliases can be found via
        /v3/categories or the Yelp category list.
      operationId: getCategoryDetails
      parameters:
        - name: alias
          in: path
          type: string
          required: true
          description: The category alias (e.g. discgolf, restaurants).
        - name: locale
          in: query
          type: string
          description: >
            Locale code in the format {language_code}_{country_code} (e.g. en_US). Filters to categories available in
            the locale and translates names. If omitted, all locales are returned with English names.
      responses:
