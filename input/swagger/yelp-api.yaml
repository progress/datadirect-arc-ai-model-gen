  /v3/autocomplete:
    get:
      tags:
        - Autocomplete
      summary: Autocomplete
      description: >
        Returns autocomplete suggestions for search keywords, businesses, and categories based on the provided input
        text.
      operationId: autocomplete
      parameters:
        - name: text
          in: query
          type: string
          required: true
          minLength: 1
          description: Search text to generate autocomplete suggestions for.
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
        - name: latitude
          in: query
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: |
            Latitude of the location to bias autocomplete results toward. Must be paired with longitude.
        - name: longitude
          in: query
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: |
            Longitude of the location to bias autocomplete results toward. Must be paired with latitude.
      responses:
        "200":
          description: Autocomplete data returned
          schema:
            $ref: "#/definitions/AutocompleteResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized - API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
