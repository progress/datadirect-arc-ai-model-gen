  /v3/categories:
    get:
      tags:
        - Categories
      summary: All Categories
      description: >
        Returns all Yelp business categories across all locales by default. Include the locale parameter to filter to
        only those categories available for a particular locale, and to localize the category names.
      operationId: getAllCategories
      parameters:
        - name: locale
          in: query
          type: string
          description: >
            Locale code in the format {language_code}_{country_code} (e.g. en_US). Filters categories to those available
            in the locale and translates category names. If omitted, all categories across all locales are returned with
            English names.
      responses:
        "200":
          description: One or more categories returned
          schema:
            $ref: "#/definitions/CategoriesResponse"
        "400":
          description: Bad Request
          schema:
