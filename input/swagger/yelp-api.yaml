          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
definitions:
  Error:
    type: object
    properties:
      code:
        type: string
        description: A machine-readable error code string (e.g. VALIDATION_ERROR).
      description:
        type: string
        description: A human-readable error description.
  BusinessSummary:
    type: object
    description: Abbreviated business data returned in search results.
    properties:
      id:
        type: string
        description: Unique Yelp ID for this business.
      alias:
        type: string
        description: |
          Unique Yelp alias of this business. May contain unicode characters (e.g. yelp-san-francisco).
      name:
        type: string
        description: Name of the business.
      image_url:
        type: string
        description: URL of the business photo.
      is_closed:
        type: boolean
        description: Whether the business has been permanently closed.
      url:
        type: string
        description: URL for the business page on Yelp.
      review_count:
        type: integer
        description: Number of reviews for this business.
      categories:
        type: array
        description: Category names and alias pairs associated with this business.
        items:
          $ref: "#/definitions/Category"
      rating:
        type: number
        format: double
        minimum: 1
        maximum: 5
        description: Rating for this business (1–5 stars, in increments of 0.5).
      coordinates:
        $ref: "#/definitions/Coordinates"
      transactions:
        type: array
        description: List of Yelp transactions that the business is registered for (e.g. delivery).
        items:
          type: string
      price:
        type: string
        description: Price level from $ to $$$$.
      location:
        $ref: "#/definitions/Location"
      phone:
        type: string
        description: Phone number of the business.
      display_phone:
        type: string
        description: Phone number of the business formatted for display.
      distance:
        type: number
        format: double
        description: Distance in meters from the requested location.
  BusinessDetails:
    type: object
    description: Full business data returned by the Business Details endpoint.
    allOf:
      - $ref: "#/definitions/BusinessSummary"
    properties:
      photos:
        type: array
        description: Up to three URLs of the business's photos.
        items:
          type: string
      hours:
        type: array
        description: Opening hours of the business.
        items:
          $ref: "#/definitions/Hours"
      is_claimed:
        type: boolean
        description: Whether the business owner has claimed the Yelp listing.
      special_hours:
        type: array
        description: |
          Out-of-the-ordinary hours for the business that apply on certain dates. Overrides hours for those dates.
        items:
          $ref: "#/definitions/SpecialHours"
      messaging:
        type: object
        description: Messaging details for the business (if available).
        properties:
          url:
            type: string
            description: URL for messaging the business.
          use_case_text:
            type: string
            description: Prompt text shown to the user (e.g. "Message the Business").
      online_reservation:
        type: object
        description: Online reservation availability information for the business (if applicable).
  Hours:
    type: object
    properties:
      hours_type:
        type: string
        description: Type of the business hours (e.g. REGULAR).
      open:
        type: array
        items:
          $ref: "#/definitions/OpenPeriod"
      is_open_now:
        type: boolean
        description: Whether the business is currently open.
  OpenPeriod:
    type: object
    properties:
      is_overnight:
        type: boolean
        description: Whether the business opens overnight (past midnight).
      start:
        type: string
        description: Start time in 24h HHmm format (e.g. 0900).
      end:
        type: string
        description: End time in 24h HHmm format (e.g. 2100).
      day:
        type: integer
        minimum: 0
        maximum: 6
        description: "Day of the week: 0 = Monday, 6 = Sunday."
  SpecialHours:
    type: object
    properties:
      date:
        type: string
        description: Date for which these special hours apply (YYYY-MM-DD).
      is_closed:
        type: boolean
        description: Whether the business is closed on this date.
      start:
        type: string
        description: Start time in 24h HHmm format.
      end:
        type: string
        description: End time in 24h HHmm format.
      is_overnight:
        type: boolean
        description: Whether the hours span midnight.
  Location:
    type: object
    properties:
      address1:
        type: string
        description: Street address of the business.
      address2:
        type: string
        description: Optional second address line.
      address3:
        type: string
        description: Optional third address line.
      city:
        type: string
        description: City of the business.
      zip_code:
        type: string
        description: Zip or postal code of the business.
      country:
        type: string
        description: ISO 3166-1 alpha-2 country code.
      state:
        type: string
        description: ISO 3166-2 state or province code.
      display_address:
        type: array
        description: Array of address lines formatted for display.
        items:
          type: string
      formatted_address:
        type: string
        description: Full address formatted as a single string with newlines (e.g. "8 Cortlandt St\nNew York, NY 10007").
  Coordinates:
    type: object
    properties:
      latitude:
        type: number
        format: double
        description: Latitude of the business location.
      longitude:
        type: number
        format: double
        description: Longitude of the business location.
  Category:
    type: object
    properties:
      alias:
        type: string
        description: Alias of a category (e.g. bars, french).
      title:
        type: string
        description: Title of a category (e.g. Bars, French).
      parent_aliases:
        type: array
        description: |
          List of parent category aliases. Present in the detailed category response (/v3/categories/{alias}).
        items:
          type: string
      country_whitelist:
        type: array
        description: Countries where this category is shown. Empty means all countries.
        items:
          type: string
      country_blacklist:
        type: array
        description: Countries where this category is hidden.
        items:
          type: string
  Review:
    type: object
    properties:
      id:
        type: string
        description: Unique Yelp ID for this review.
      url:
        type: string
        description: URL of the review.
      text:
        type: string
        description: Excerpt of the review (max 160 characters).
      rating:
        type: integer
        minimum: 1
        maximum: 5
        description: Rating of the review (1–5 stars).
      time_created:
        type: string
        description: Timestamp when the review was created (YYYY-MM-DD HH:mm:ss).
      user:
        $ref: "#/definitions/User"
  User:
    type: object
    properties:
      id:
        type: string
        description: Unique Yelp ID of the reviewer.
      profile_url:
        type: string
        description: URL of the reviewer's profile page.
      image_url:
        type: string
        description: URL of the reviewer's profile photo.
      name:
        type: string
        description: Reviewer's display name.
  Event:
    type: object
    properties:
      id:
        type: string
        description: Unique Yelp ID of the event.
      name:
        type: string
        description: Name of the event.
      description:
        type: string
        description: Full description of the event.
      is_free:
        type: boolean
        description: Whether the event is free.
      cost:
        type: number
        format: double
        description: Minimum cost to attend the event.
      cost_max:
        type: number
        format: double
        description: Maximum cost to attend the event.
      business_id:
        type: string
        description: >
          ID of the business associated with this event (if any). Can be used with
          /v3/businesses/{business_id_or_alias}.
      event_site_url:
        type: string
        description: URL of the event on the event's own site.
      image_url:
        type: string
        description: URL of the event banner image.
      tickets_url:
        type: string
        description: URL to purchase tickets for the event.
      interested_count:
        type: integer
        description: Number of Yelp users interested in attending.
      attending_count:
        type: integer
        description: Number of Yelp users who have marked as attending.
      is_canceled:
        type: boolean
        description: Whether the event has been canceled.
      is_official:
        type: boolean
        description: Whether the event is an official Yelp event.
      latitude:
        type: number
        format: double
        description: Latitude of the event location.
      longitude:
        type: number
        format: double
        description: Longitude of the event location.
      location:
        $ref: "#/definitions/Location"
      category:
        type: string
        description: Category alias for the event.
      time_start:
        type: string
        description: Start date/time of the event (ISO 8601).
      time_end:
        type: string
        description: End date/time of the event (ISO 8601). Empty string if ongoing.
  AutocompleteResponse:
    type: object
    description: Response returned by the /v3/autocomplete endpoint.
    properties:
      categories:
        type: array
        description: Autocomplete suggestions matching Yelp category aliases.
        items:
          type: object
          properties:
            alias:
              type: string
              description: Category alias.
            title:
              type: string
              description: Localized category title.
      businesses:
        type: array
        description: Business suggestions matching the input text.
        items:
          type: object
          properties:
            id:
              type: string
              description: Unique Yelp business ID.
            name:
              type: string
              description: Business name.
      terms:
        type: array
        description: Generic search term suggestions.
        items:
          type: object
          properties:
            text:
              type: string
              description: Suggested search term string.
  AIChatResponse:
    type: object
    description: Response returned by the POST /ai/chat/v2 endpoint.
    properties:
      chat_id:
        type: string
        description: >-
          Unique conversation identifier. Pass this as `chat_id` in subsequent requests to continue the same
          conversation.
      response:
        type: object
        description: AI-generated answer to the user query.
        properties:
          text:
            type: string
            description: Natural language response text.
          tags:
            type: array
            description: Inline entity annotations within the response text.
            items:
              type: object
              properties:
                tag_type:
                  type: string
                  description: Type of the tagged entity (e.g. business).
                start:
                  type: integer
                  description: Start character index of the tag within `text`.
                end:
                  type: integer
                  description: End character index of the tag within `text`.
                meta:
                  type: object
                  description: Additional metadata about the tagged entity.
      types:
        type: array
        description: Content category labels describing the nature of the response (e.g. ["businesses"]).
        items:
          type: string
      entities:
        type: array
        description: Business or entity references cited in the AI response.
        items:
          type: object
          properties:
            businesses:
              type: array
