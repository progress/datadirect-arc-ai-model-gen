        - name: longitude
          in: query
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Required if location is not provided. Must be paired with latitude.
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
      responses:
        "200":
          description: A featured event was returned
          schema:
            $ref: "#/definitions/Event"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized - API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/events/{event_id}:
