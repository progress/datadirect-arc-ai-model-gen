swagger: "2.0"
info:
  title: Yelp Fusion API
  description: >
    The Yelp Fusion API lets you connect with local businesses using Yelp's extensive data. Includes AI-powered
    conversational search, business search, reviews, events, categories, and more. Requires a Yelp API key passed as a
    Bearer token.
  version: "3.0"
  contact:
    name: Yelp Developer Support
    url: https://docs.developer.yelp.com
  termsOfService: https://www.yelp.com/static?p=tos
host: api.yelp.com
basePath: /
schemes:
  - https
securityDefinitions:
  BearerAuth:
    type: apiKey
    in: header
    name: Authorization
    description: "Yelp API key. Format: 'Bearer YOUR_API_KEY'"
security:
  - BearerAuth: []
consumes:
  - application/json
produces:
  - application/json
tags:
  - name: AI
    description: Yelp AI conversational search and chat
  - name: Businesses
    description: Search and retrieve business information
  - name: Reviews
    description: Access business reviews and highlights
  - name: Events
    description: Search and retrieve local events
  - name: Categories
    description: Browse Yelp business categories
  - name: Autocomplete
    description: Autocomplete suggestions for search
paths:
  /ai/chat/v2:
    post:
      tags:
        - AI
      summary: Yelp AI API (Search & Chat)
      description: >
        Brings conversational intelligence to your application, enabling users to ask natural language questions and
        receive real-time, contextually relevant answers powered by Yelp's latest business data and reviews. Supports
        multi-turn conversations, direct business queries, and conversational restaurant reservations.
      operationId: aiChat
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - query
            properties:
              query:
                type: string
                maxLength: 1000
                description: >
                  Natural language text for querying Yelp-specific information (e.g. "Can you find a Thai restaurant
                  near me?"). Plain text only.
              chat_id:
                type: string
                description: >
                  Uniquely identifies the current conversation session. Omit on the first request; use the returned
                  chat_id on subsequent requests to continue the same conversation.
              user_context:
                type: object
                description: >
                  Optional location data to help the AI tailor results to the user's location. If omitted and a
                  location-based query is made, the system may prompt the user to specify a location.
                properties:
                  latitude:
                    type: number
                    format: double
                    description: Latitude of the user's current location.
                  longitude:
                    type: number
                    format: double
                    description: Longitude of the user's current location.
                  locale:
                    type: string
                    description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
              request_context:
                type: object
                description: >
                  Optional settings that control how the API processes the request, affecting response format and
                  content generation behavior.
                properties:
                  skip_text_generation:
                    type: boolean
                    description: |
                      When true, the API returns structured data without generating a natural language response text.
      responses:
        "200":
          description: Successful response with AI-generated answer
          schema:
            $ref: "#/definitions/AIChatResponse"
        "400":
          description: Bad Request – message varies depending on failure scenario
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden – API key not authorized for this endpoint
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large – request length exceeded maximum allowed
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited – daily quota or queries-per-second limit exceeded
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/search:
    get:
      tags:
        - Businesses
      summary: Business Search
      description: >
        Returns up to 240 businesses based on the provided search criteria. Results include basic business information.
        The API does not return businesses without any reviews.
      operationId: searchBusinesses
      parameters:
        - name: location
          in: query
          type: string
          minLength: 1
          maxLength: 250
          description: >
            Required if latitude and longitude are not provided. Geographic area to search (e.g. "New York City", "NYC",
            "350 5th Ave, New York, NY 10118"). Results may not be strictly within the specified location.
        - name: latitude
          in: query
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: |
            Required if location is not provided. Latitude of the search origin. Must be paired with longitude.
        - name: longitude
          in: query
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: |
            Required if location is not provided. Longitude of the search origin. Must be paired with latitude.
        - name: term
          in: query
          type: string
          description: >
            Search term, e.g. "food" or "restaurants". May also be a business name such as "Starbucks". Defaults to
            searching across popular categories if omitted.
        - name: radius
          in: query
          type: integer
          minimum: 0
          maximum: 40000
          description: >
            Suggested search radius in meters (max 40000 / ~25 miles). Actual radius may vary by area density. Returns
            AREA_TOO_LARGE error if too large.
        - name: categories
          in: query
          type: array
          items:
            type: string
          collectionFormat: csv
          description: >
            Comma-delimited category aliases to filter results (e.g. "bars,french"). Uses OR logic. Use the alias, not
            the display name (e.g. "discgolf" not "Disc Golf").
        - name: locale
          in: query
          type: string
          description: |
            Locale code in the format {language_code}_{country_code} (e.g. en_US). See the list of supported locales.
        - name: price
          in: query
          type: array
          items:
            type: integer
          collectionFormat: csv
          description: >
            Pricing levels to filter by: 1=$, 2=$$, 3=$$$, 4=$$$$. Comma-delimited (e.g. "1,2,3" returns $, $$, and $$$
            businesses).
        - name: open_now
          in: query
          type: boolean
          description: |
            When true, only returns businesses open at the time of the request. Cannot be used together with open_at.
        - name: open_at
          in: query
          type: integer
          description: >
            Unix timestamp (in the search location's timezone). Returns businesses open at the given time. Cannot be
            used together with open_now.
        - name: attributes
          in: query
          type: array
          items:
            type: string
          collectionFormat: csv
          description: >
            Additional attribute filters. Examples: hot_and_new, request_a_quote, reservation, waitlist_reservation,
            gender_neutral_restrooms, open_to_all, wheelchair_accessible. Premium filters also available with Places
            Premium Plan.
        - name: sort_by
          in: query
          type: string
          enum:
            - best_match
            - rating
            - review_count
            - distance
          default: best_match
          description: |
            Sort order suggestion. Note: rating sort uses a Bayesian-adjusted value accounting for number of ratings.
        - name: device_platform
          in: query
          type: string
          enum:
            - android
            - ios
            - mobile-generic
          description: Determines the platform used for the mobile_link field in responses.
        - name: reservation_date
          in: query
          type: string
          description: Reservation date filter in YYYY-MM-DD format.
        - name: reservation_time
          in: query
          type: string
          description: Reservation time filter in HH:MM format.
        - name: reservation_covers
          in: query
          type: integer
          minimum: 1
          maximum: 10
          description: Number of people for the reservation filter.
        - name: matches_party_size_param
          in: query
          type: boolean
          description: When true, filters out results without openings matching the reservation parameters.
        - name: job_alias
          in: query
          type: string
          description: >
            Return only businesses that service this job type alias (e.g. "plumbing", "hvac-repair"). Acceptable aliases
            from the Get Jobs endpoint.
        - name: limit
          in: query
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: Number of results to return (max 50, default 20).
        - name: offset
          in: query
          type: integer
          minimum: 0
          maximum: 240
          description: >
            Number of results to offset for pagination. The total results cap is 240, so offset + limit cannot
            meaningfully exceed 240.
      responses:
        "200":
          description: One or more businesses found
          schema:
            $ref: "#/definitions/BusinessSearchResponse"
        "400":
          description: Bad Request – message varies depending on failure scenario
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden – API key not authorized for this endpoint
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited – daily quota or queries-per-second limit exceeded
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/search/phone:
    get:
      tags:
        - Businesses
      summary: Phone Search
      description: >
        Returns a list of businesses based on a provided phone number. Multiple businesses may share the same phone
        number (e.g. chain store 1-800 numbers). The API does not return businesses without any reviews.
      operationId: phoneSearch
      parameters:
        - name: phone
          in: query
          type: string
          required: true
          minLength: 1
          maxLength: 32
          description: |
            Phone number of the business. Must start with + and include the country code (e.g. +14159083801).
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
      responses:
        "200":
          description: One or more businesses found
          schema:
            $ref: "#/definitions/BusinessSearchResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/matches:
    get:
      tags:
        - Businesses
      summary: Business Match
      description: >
        Matches business data from other sources against Yelp businesses based on precise business information (name and
        address). Best used when you have exact address details. The API does not return businesses without any reviews.
      operationId: businessMatch
      parameters:
        - name: name
          in: query
          type: string
          required: true
          maxLength: 64
          description: |
            The name of the business. Only digits, letters, spaces, and !#$%&+,./:?@' are allowed.
        - name: address1
          in: query
          type: string
          required: true
          maxLength: 64
          description: >
            First line of the business's address. Only digits, letters, spaces, and '/#&,.: are allowed. An empty string
            matches service businesses with no street address.
        - name: address2
          in: query
          type: string
          maxLength: 64
          description: Second line of the business's address.
        - name: address3
          in: query
          type: string
          maxLength: 64
          description: Third line of the business's address.
        - name: city
          in: query
          type: string
          required: true
          minLength: 1
          maxLength: 64
          description: The city of the business. Only digits, letters, spaces, and '.() are allowed.
        - name: state
          in: query
          type: string
          required: true
          minLength: 1
          maxLength: 3
          description: ISO 3166-2 state code of the business.
        - name: country
          in: query
          type: string
          required: true
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code of the business.
        - name: postal_code
          in: query
          type: string
          maxLength: 12
          description: Postal/Zip code of the business.
        - name: latitude
          in: query
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitude hint to improve matching. Must be paired with longitude.
        - name: longitude
          in: query
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitude hint to improve matching. Must be paired with latitude.
        - name: phone
          in: query
          type: string
          minLength: 1
          maxLength: 32
          description: >
            Phone number of the business. Submit as locally formatted digits only (e.g. 016703080) or internationally
            formatted with leading + (e.g. +35316703080).
        - name: yelp_business_id
          in: query
          type: string
          minLength: 22
          maxLength: 22
          description: Unique 22-character Yelp identifier used as a hint when finding a matching business.
        - name: limit
          in: query
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Number of results to return (max 10, default 3).
        - name: match_threshold
          in: query
          type: string
          enum:
            - none
            - default
            - strict
          default: default
          description: >
            Match quality threshold. none=return all potential matches; default=return only very closely matching
            businesses; strict=apply very strict match quality threshold.
      responses:
        "200":
          description: One or more businesses found
          schema:
            type: object
            required:
              - businesses
            properties:
              businesses:
                type: array
                items:
                  $ref: "#/definitions/BusinessSummary"
              total:
                type: integer
                format: int32
                description: Total number of matching businesses.
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/{business_id_or_alias}:
    get:
      tags:
        - Businesses
      summary: Business Details
      description: >
        Returns detailed business content for a given business ID or alias. Business IDs are obtained from
        /v3/businesses/search, /v3/businesses/search/phone, /v3/transactions/{transaction_type}/search, or
        /v3/autocomplete. The API does not return businesses without any reviews.
      operationId: getBusinessDetails
      parameters:
        - name: business_id_or_alias
          in: path
          type: string
          required: true
          description: >
            A unique identifier for a Yelp Business. Can be either a 22-character Yelp Business ID or a Yelp Business
            Alias.
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
        - name: device_platform
          in: query
          type: string
          enum:
            - android
            - ios
            - mobile-generic
          description: Determines the platform for the mobile_link field in responses.
      responses:
        "200":
          description: Business with the requested ID was returned
          schema:
            $ref: "#/definitions/BusinessDetails"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/transactions/{transaction_type}/search:
    get:
      tags:
        - Businesses
      summary: Food Delivery Search
      description: >
        Returns a list of businesses that support the specified transaction type. Currently only supports food delivery
        in the US. The API does not return businesses without any reviews.
      operationId: foodDeliverySearch
      parameters:
        - name: transaction_type
          in: path
          type: string
          required: true
          enum:
            - delivery
          default: delivery
          description: |
            Type of transaction supported by the business. Currently only "delivery" is supported.
        - name: location
          in: query
          type: string
          minLength: 1
          maxLength: 250
          description: >
            Required if latitude and longitude are not provided. Geographic area string (e.g. "New York City", "350 5th
            Ave, New York, NY 10118").
        - name: latitude
          in: query
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Required if location is not provided. Must be paired with longitude.
        - name: longitude
          in: query
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Required if location is not provided. Must be paired with latitude.
        - name: term
          in: query
          type: string
          description: Search term (e.g. "food", "pizza"). Defaults to searching across popular categories.
        - name: categories
          in: query
          type: array
          items:
            type: string
          collectionFormat: csv
          description: Comma-delimited list of category aliases to filter results.
        - name: price
          in: query
          type: array
          items:
            type: integer
          collectionFormat: csv
          description: "Pricing levels to filter by: 1=$, 2=$$, 3=$$$, 4=$$$$."
      responses:
        "200":
          description: Transaction data for one or more businesses returned
          schema:
            $ref: "#/definitions/BusinessSearchResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/engagement:
    get:
      tags:
        - Businesses
      summary: Business Engagement Metrics
      description: Returns engagement metrics for businesses.
      operationId: getBusinessEngagement
      parameters:
        - name: business_ids
          in: query
          type: array
          items:
            type: string
          collectionFormat: csv
          required: true
          description: Comma-delimited list of Yelp business IDs to fetch engagement metrics for.
      responses:
        "200":
          description: Engagement metrics returned for the requested businesses.
          schema:
            type: object
            description: Engagement metrics response for one or more businesses.
            properties:
              businesses:
                type: array
                description: List of businesses and their engagement metrics.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Yelp business ID.
                    engagement:
                      type: object
                      description: Engagement metrics for the business (e.g., views, clicks, calls).
                      additionalProperties: true
            additionalProperties: false
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/{business_id_or_alias}/service_offerings:
    get:
      tags:
        - Businesses
      summary: Business Service Offerings
      description: Returns service offerings for a given business.
      operationId: getServiceOfferings
      parameters:
        - name: business_id_or_alias
          in: path
          type: string
          required: true
          description: >
            A unique identifier for a Yelp Business. Can be either a 22-character Yelp Business ID or a Yelp Business
            Alias.
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
      responses:
        "200":
          description: Service offerings for the requested business returned.
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/businesses/{business_id_or_alias}/review_highlights:
    get:
      tags:
        - Reviews
      summary: Review Highlights
      description: Returns highlighted review snippets for a given business.
      operationId: getReviewHighlights
      parameters:
        - name: business_id_or_alias
          in: path
          type: string
          required: true
          description: >
            A unique identifier for a Yelp Business. Can be either a 22-character Yelp Business ID or a Yelp Business
            Alias.
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
      responses:
        "200":
          description: Review highlights for the requested business returned.
          schema:
            type: object
            title: ReviewHighlightsResponse
            properties:
              business_id:
                type: string
                description: A unique identifier for the Yelp Business (ID or alias).
              highlights:
                type: array
                description: A list of highlighted review snippets for the business.
                items:
                  type: object
                  properties:
                    text:
                      type: string
                      description: The highlighted review snippet text.
                    review_id:
                      type: string
                      description: The identifier of the review this snippet is derived from.
                    language:
                      type: string
                      description: Locale code of the review snippet (e.g. en_US).
                  required:
                    - text
            required:
              - business_id
              - highlights
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized – API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
