            $ref: "#/definitions/Error"
  /v3/businesses/{business_id_or_alias}/reviews:
    get:
      tags:
        - Reviews
      summary: Reviews
      description: >
        Returns up to three review excerpts for a given business ordered by Yelp's default sort order. The API does not
        return businesses without any reviews. Business IDs are obtained from /v3/businesses/search,
        /v3/businesses/search/phone, /v3/transactions/{transaction_type}/search, or /v3/autocomplete.
      operationId: getReviews
      parameters:
        - name: business_id_or_alias
          in: path
          type: string
          required: true
          description: >
            A unique identifier for a Yelp Business. Can be either a 22-character Yelp Business ID or a Yelp Business
            Alias.
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
        - name: sort_by
          in: query
          type: string
          enum:
            - yelp_sort
          default: yelp_sort
          description: Sort reviews by the specified order.
      responses:
        "200":
          description: >-
            Returns up to three review excerpts for the given business. Response includes `reviews` (array), `total`
            (integer), and `possible_languages` (array of locale strings indicating available review languages).
          schema:
            $ref: "#/definitions/ReviewsResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized - API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/events:
    get:
      tags:
        - Events
      summary: Event Search
      description: Returns events that match the provided search criteria.
      operationId: searchEvents
      parameters:
        - name: locale
          in: query
          type: string
          description: Locale code in the format {language_code}_{country_code} (e.g. en_US).
        - name: offset
          in: query
          type: integer
          minimum: 0
          maximum: 1000
          description: Offset the list of returned results by this amount.
        - name: limit
          in: query
          type: integer
          minimum: 1
          maximum: 50
          default: 3
          description: Number of event results to return (max 50, default 3).
        - name: sort_by
          in: query
          type: string
          enum:
            - asc
            - desc
          default: desc
          description: Sort results in ascending or descending order.
        - name: sort_on
          in: query
          type: string
          enum:
            - popularity
            - time_start
          default: popularity
          description: Field to sort results on.
        - name: start_date
          in: query
          type: integer
          description: |
            Unix timestamp. Returns only events that begin at or after the specified time.
        - name: end_date
          in: query
          type: integer
          description: |
            Unix timestamp. Returns only events that end at or before the specified time.
        - name: categories
          in: query
          type: array
          items:
            type: string
          collectionFormat: csv
          description: List of category aliases to filter events.
        - name: is_free
          in: query
          type: boolean
          description: |
            Filter by free events. When omitted, both free and paid events are returned.
        - name: excluded_events
          in: query
          type: array
          items:
            type: string
          collectionFormat: csv
          description: List of event IDs to exclude from results.
        - name: location
          in: query
          type: string
          minLength: 1
          maxLength: 250
          description: >
            Required if latitude and longitude are not provided. Geographic area string (e.g. "New York City", "350 5th
            Ave, New York, NY 10118").
        - name: latitude
          in: query
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Required if location is not provided. Must be paired with longitude.
        - name: longitude
          in: query
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Required if location is not provided. Must be paired with latitude.
        - name: radius
          in: query
          type: integer
          minimum: 0
          maximum: 40000
          description: |
            Search radius in meters (max 40000 / approx 25 miles). Returns AREA_TOO_LARGE error if too large.
      responses:
        "200":
          description: One or more events found
          schema:
            $ref: "#/definitions/EventSearchResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/Error"
        "401":
          description: |
            Unauthorized - API key expired or missing required scopes. Error codes: UNAUTHORIZED_API_KEY, TOKEN_INVALID
          schema:
            $ref: "#/definitions/Error"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/Error"
        "404":
          description: Resource Not Found
          schema:
            $ref: "#/definitions/Error"
        "413":
          description: Payload Too Large
          schema:
            $ref: "#/definitions/Error"
        "429":
          description: Rate Limited
          schema:
            $ref: "#/definitions/Error"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/Error"
        "503":
          description: Service Unavailable
          schema:
            $ref: "#/definitions/Error"
  /v3/events/featured:
    get:
      tags:
